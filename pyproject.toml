[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence expression
build-backend = "setuptools.build_meta"

[project]
name = "flux-brain"
version = "0.1.0"
description = "Flux server side: the Discord relay that connects a capture channel to a vault repository maintained by Claude Code routines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"           # tomllib
authors = [{ name = "Eric Guichard" }]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",              # HTML email bodies
  "python-docx>=1.1",                  # .docx text
  "python-pptx>=1.0",                  # .pptx text
  "odfpy>=1.4",                        # OpenDocument text
  "openpyxl>=3.1",                     # .xlsx cells
  "cramjam>=2.8",                      # Apple iWork (.pages/.key/.numbers) snappy blocks
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]        # voice memo transcription (downloads the "small" model, ~460 MB, on first use)
google = ["google-auth-oauthlib>=1.2"]    # the three consent commands (flux-drive-auth, flux-gmail-auth, flux-tasks-auth); API calls use plain requests
drive = ["google-auth-oauthlib>=1.2"]     # the old name of the same extra, kept so `pip install "flux-brain[drive]"` still works
dev = ["pytest>=8"]

[project.scripts]
flux-relay = "flux_brain.relay:main"
flux-drive-auth = "flux_brain.lib.drive:auth_main"   # one-time Drive consent (needs the `google` extra)
flux-gmail = "flux_brain.gmail:main"                 # the Gmail module, one pass (run by flux-gmail.timer)
flux-gmail-auth = "flux_brain.gmail:auth_main"       # one-time Gmail consent (needs the `google` extra)
flux-tasks = "flux_brain.tasks:main"                 # the Tasks module (long-running, flux-tasks.service)
flux-tasks-auth = "flux_brain.tasks:auth_main"       # one-time Tasks consent (needs the `google` extra)

[tool.setuptools]
script-files = ["bin/flux-relay-loop", "bin/flux-ask"]   # shell helpers installed next to flux-relay

[tool.setuptools.packages.find]
include = ["flux_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
