# Flux server configuration. Copy to $FLUX_HOME/flux.toml. No secrets here: they go in flux.env.
# Every instance-specific value lives in this file or in flux.env; the code contains none.

[owner]
name = "Your Name"                 # how the relay and the routine refer to you
discord_user_id = "000000000000000000"   # @mentioned on questions

[vault]
repo = "you/vault"                 # private repository made from the vault template
branch = "main"

[discord]
channel = "flux"                   # capture + conversation channel (id cached in state once found)
log_channel = "flux-log"           # muted log channel; while absent, everything posts to `channel`
# guild id and bot token: flux.env

[routine]
# Cloud routine "vault-inbox": the relay starts it when a capture arrives. Token: flux.env ROUTINE_FIRE_TOKEN.
fire_url = "https://api.anthropic.com/v1/claude_code/routines/<trigger id>/fire"
min_interval_s = 180               # wait for a run marker before another start
marker_fresh_s = 1200              # a .run/active older than this is a crashed run's leftover; keep it equal to the
                                   # "20 minutes" of the vault's CLAUDE.md (Run protocol step 3) and of both routine prompts
post_run_quiet_s = 120             # no new start this long after a run ends (a late commit restarts the wait)
author = "Claude"                  # git author name of the routines' commits (the relay audits them)

[capture]
settle_s = 60                      # an Obsidian note must stay unchanged this long before it counts
max_attachment_mb = 20
audio_minutes = 30                 # transcription cap

[paths]
home = "/var/lib/flux"             # state, tree cache, logs; override with $FLUX_HOME
lock_dir = "/run/lock"

[modules]
drive = false                      # attachments to cloud storage (Google Drive today)
memory = false                     # memory mirror + page/memory reconcile
gmail = false                      # Gmail label feed
tasks = false                      # Google Tasks list per active project (official API)
calendar = false                   # Google Calendar -> one dated file per day in the vault (read-only)
drive_watch = false                # new files in chosen Google Drive folders -> inbox captures
followups = false                  # sent emails still waiting for an answer -> followups/waiting.md (needs the gmail token)
triage = false                     # new emails that probably matter -> #flux posts with ✅ file / ✍️ reply-draft buttons

[drive]                            # when modules.drive = true
drive_id = ""
folder_id = ""
token_file = "drive-token.json"    # relative to paths.home
links = "off"                      # "details": Docs/Drive links in a message get name, type, folder, last edit in
                                   # the capture, and their text with the word +text; "text": their text by default,
                                   # the word -text for details only. Both need a token that can READ
                                   # those files (drive.readonly), not the drive.file one of flux-drive-auth (INSTALL.md)

[gmail]                            # when modules.gmail = true
label = "📁 Flux"
filed_label = "📁 Flux/Filed"
token_file = "gmail-token.json"
originals_to_drive = true          # false: emails and their attachments stay in Gmail only (text still extracted)
follow_threads = true              # a reply arriving in a conversation already filed is filed too (no new label needed)
follow_days = 3                    # how far back an incoming reply is looked for

[tasks]                            # when modules.tasks = true
token_file = "tasks-token.json"
prefix = "📁 "                      # list title prefix
tick_s = 60                        # seconds between ticks; (1 + active projects) calls per tick, 50k/day quota
settle_s = 45                      # a list must be unchanged this long before its edits are filed

[calendar]                         # when modules.calendar = true
token_file = "calendar-token.json"
mail_context = false               # with details = true: under today's and tomorrow's events, the last email with each
                                   # attendee (date, subject, Gmail link); needs the gmail token
mail_context_days = 2
calendars = "selected"             # "all", "selected" (ticked in Google Calendar) or a list of calendar ids
exclude = []                       # calendar ids to skip (e.g. a holidays calendar)
lookahead_days = 7                 # today + this many days, one file each: calendar/YYYY-MM-DD.md
timezone = ""                      # IANA name; empty = the primary calendar's time zone
details = false                    # true = attendees + description too (text written by other people)
max_description = 1000             # characters of description kept per event
dir = "calendar"                   # vault folder

[monitoring]                       # optional; empty = no pings, no alerts
ops_webhook_env = "OPS_WEBHOOK_URL"   # name of the env var holding a Discord webhook for failure alerts

[drive_watch]                      # when modules.drive_watch = true; uses [drive] token_file, which must READ these folders
folders = []                       # e.g. [{ id = "<folder id>", project = "<page slug>" }, { id = "<folder id>" }]; sub-folders included
settle_s = 600                     # file a new file once it has gone this long without an edit
owned_only = true                  # My Drive files must be yours; on a shared drive the folder list is the filter
text = true                        # copy the text into raw/attachments/ (false = details only)
max_per_run = 10
suggest = false                    # weekly: post the folders you changed most (outside the watched ones) with a ✅ to watch
suggest_every_days = 7
suggest_min_files = 3
suggest_max = 3
never = []                         # folder ids never suggested, e.g. the attachment folder of the Drive module

[followups]                        # when modules.followups = true; uses [gmail] token_file
days = 4                           # list a sent email once it has waited this many days
lookback_days = 30                 # older than this: dropped
dismiss_label = "!🌀 Flux/No reply needed"   # label a thread with it to drop it from the list (created on first run)
ignore = []                        # recipients never tracked: "someone@example.org" or "@example.org"
max_items = 30
skip_forwards = true               # "Fwd:" / "TR:" emails are FYI: not tracked

[triage]                           # when modules.triage = true; uses [gmail] token_file and the Discord bot
keywords = []                      # e.g. your active projects: a subject or snippet naming one is posted
correspondents_days = 180          # a sender you wrote to in this window is posted
hours_utc = [6, 21]                # post only between these UTC hours (the rest wait)
max_posts = 8                      # per run
ttl_days = 3                       # buttons stop working after this
